# Relay Chat Server Configuration
host: "0.0.0.0"
port: "3002"
database_path: "relay.db"
jwt_secret: "" # REQUIRED: Set a strong random secret (e.g. openssl rand -hex 32)
upload_dir: "uploads"
max_upload_mb: 50
# tls_cert: "certs/cert.pem"
# tls_key: "certs/key.pem"
static_dir: "client/dist"
# allowed_origins:
#   - "https://your-domain.com"
#   - "https://app.your-domain.com"

# ICE servers for WebRTC (STUN/TURN). If not set, defaults to Google STUN.
# Configure a TURN server for VPN/strict NAT support (e.g. coturn):
# ice_servers:
#   - urls:
#       - "stun:stun.l.google.com:19302"
#   - urls:
#       - "turn:your-turn-server.com:3478"
#       - "turns:your-turn-server.com:5349"
#     username: "your-username"
#     credential: "your-password"

# Federation: connect trusted Relay instances for cross-server chat.
# federation:
#   enabled: true
#   instance_url: "https://your-relay.example.com"   # Public URL of this instance
#   token: "shared-secret-for-incoming-peers"         # Token peers use to connect to us
